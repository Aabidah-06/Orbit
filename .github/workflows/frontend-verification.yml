name: Orbit frontend verification
on:
  push:
    branches:
      - feat/issue-83-fiat-display
      - fix/issue-82-wallet-session
      - feat/issue-81-accessible-theme
      - feat/issue-80-payment-links
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Inspect npm working directory
        run: pwd && ls -l package-lock.json package.json && npm config get package-lock
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build production frontend even if baseline tests fail
        if: ${{ success() || failure() }}
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  backend:
    if: github.ref_name == 'feat/issue-80-payment-links'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
